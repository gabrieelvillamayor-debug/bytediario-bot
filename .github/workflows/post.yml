name: Publicar Curiosidad

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 Argentina
    - cron: "0 18 * * *"   # 15:00 Argentina
    - cron: "0 23 * * *"   # 20:00 Argentina
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install requests deep-translator feedparser

      - name: Ejecutar bot
        run: python main.py
